<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c77d5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#0d0f12"/>

  <!-- Grid lines (cartographic) -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Outer pulse ring -->
  <circle cx="256" cy="256" r="190" fill="url(#grad)" opacity="0.06"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.12"/>

  <!-- Crosshair lines -->
  <g opacity="0.1" stroke="#c77d5a" stroke-width="1">
    <line x1="256" y1="40" x2="256" y2="210"/>
    <line x1="256" y1="302" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="210" y2="256"/>
    <line x1="302" y1="256" x2="472" y2="256"/>
  </g>

  <!-- Survey marker ticks -->
  <g opacity="0.15" stroke="#f59e0b" stroke-width="2">
    <line x1="251" y1="70" x2="261" y2="70"/>
    <line x1="251" y1="442" x2="261" y2="442"/>
    <line x1="70" y1="251" x2="70" y2="261"/>
    <line x1="442" y1="251" x2="442" y2="261"/>
  </g>

  <!-- Main pin/marker -->
  <g filter="url(#shadow)">
    <path d="M256 72c-80 0-145 65-145 145 0 88 145 220 145 220s145-132 145-220c0-80-65-145-145-145zm0 197c-28.7 0-52-23.3-52-52s23.3-52 52-52 52 23.3 52 52-23.3 52-52 52z" fill="url(#grad)"/>
    <circle cx="256" cy="217" r="32" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Signal arc -->
  <path d="M256 112a105 105 0 0 0-80 35" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
</svg>
